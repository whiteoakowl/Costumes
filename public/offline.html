<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a8676d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>You're offline · Dance Studio &amp; Costumes</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #fbf6f1; color: #4a4245; text-align: center;
      }
      .card {
        max-width: 380px; background: #fffdfb; border: 1px solid #eee2de; border-radius: 20px;
        padding: 36px 28px; box-shadow: 0 6px 20px rgba(120, 70, 70, 0.08);
      }
      img { width: 84px; height: 84px; border-radius: 20px; }
      h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 30px; color: #2f2a2c; margin: 18px 0 8px; }
      p { margin: 0 0 22px; line-height: 1.5; }
      button {
        font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
        background: linear-gradient(135deg, #c98f8f, #a8676d);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>There's no internet connection right now. Check your Wi-Fi or signal, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
  </body>
</html>
